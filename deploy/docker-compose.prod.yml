# Chạy trên VPS. Dùng từ thư mục gốc repo:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Chỉ Caddy (80/443) và LiveKit (7881/tcp, 7882/udp, 3478/udp) mở ra Internet.
name: bangden

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bangden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bangden
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bangden"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.8.0
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"   # media qua TCP khi UDP bị chặn
      - "7882:7882/udp"   # media UDP (một cổng, mux)
      - "3478:3478/udp"   # TURN/UDP

  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bangden:${POSTGRES_PASSWORD}@postgres:5432/bangden
      JWT_SECRET: ${JWT_SECRET}
      WHITEBOARD_SECRET: ${WHITEBOARD_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://live.${DOMAIN}
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD}
      SEED_TEACHER_NAME: ${SEED_TEACHER_NAME}
      SEED_DEMO: "false"
      COOKIE_SECURE: "true"
      TZ: Asia/Ho_Chi_Minh

  whiteboard:
    build: ../apps/whiteboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bangden:${POSTGRES_PASSWORD}@postgres:5432/bangden
      WHITEBOARD_SECRET: ${WHITEBOARD_SECRET}

  web:
    build:
      context: ../apps/web
      args:
        API_INTERNAL_URL: http://api:3001
        NEXT_PUBLIC_WHITEBOARD_URL: wss://board.${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - livekit
      - whiteboard

volumes:
  pgdata:
  caddy_data:
  caddy_config:
