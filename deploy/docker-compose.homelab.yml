# Chạy trên máy chủ tại nhà, đặt sau Nginx Proxy Manager (NPM) có sẵn.
# Khác deploy/docker-compose.prod.yml:
#   - Không có Caddy: NPM giữ cổng 443 và chuyển vào web, livekit, whiteboard qua IP LAN của VM
#     (cổng 5100–5102, chỉ mở trong mạng nhà; router không chuyển các cổng này ra Internet).
#   - Không có egress: ghi hình và phát trực tiếp tắt (máy 4 GB RAM không gánh được).
#   - Giới hạn RAM từng dịch vụ để không lấn AdGuard, NPM, Portainer trên cùng máy.
# Hướng dẫn đầy đủ: docs/05-trien-khai-homelab.md
#
#   docker compose -f deploy/docker-compose.homelab.yml --env-file .env up -d --build
name: bangden

x-logging: &logging
  # Giới hạn log để không đầy ổ (mỗi dịch vụ tối đa 3 × 10 MB).
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      POSTGRES_USER: bangden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bangden
    ports:
      # Chỉ nghe trên localhost của VM, dùng cho SSH tunnel từ DBeaver/pgAdmin; không lộ ra LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bangden"]
      interval: 5s
      timeout: 3s
      retries: 20

  # LiveKit cần Redis trong cấu hình (để bật ghi hình sau này); Redis gần như không tốn RAM.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.8.0
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging
    depends_on:
      - redis
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.homelab.yaml:/etc/livekit.yaml:ro
    # Video, âm thanh đi thẳng tới đây, không qua NPM. Mở 3 cổng này trên router, trỏ về VM.
    ports:
      - "7881:7881/tcp"   # media qua TCP khi mạng học viên chặn UDP
      - "7882:7882/udp"   # media UDP (một cổng, mux)
      - "3478:3478/udp"   # TURN/UDP
      - "${LIVEKIT_HTTP_PORT:-5101}:7880"   # NPM: ${LIVE_DOMAIN} → <IP LAN của VM>:5101 (WebSocket)

  api:
    build: ../apps/api
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bangden:${POSTGRES_PASSWORD}@postgres:5432/bangden
      JWT_SECRET: ${JWT_SECRET}
      WHITEBOARD_SECRET: ${WHITEBOARD_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://${LIVE_DOMAIN}
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD}
      SEED_TEACHER_NAME: ${SEED_TEACHER_NAME}
      SEED_DEMO: "false"
      COOKIE_SECURE: "true"
      # Bỏ trống S3_* thì nút tải tài liệu ẩn; điền Cloudflare R2 để bật (docs/03-trien-khai-vps.md).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RECORDING_ENABLED: "false"
      APP_URL: https://${APP_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TZ: Asia/Ho_Chi_Minh

  whiteboard:
    build: ../apps/whiteboard
    restart: unless-stopped
    mem_limit: 192m
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bangden:${POSTGRES_PASSWORD}@postgres:5432/bangden
      WHITEBOARD_SECRET: ${WHITEBOARD_SECRET}
    ports:
      - "${BOARD_PORT:-5102}:1234"   # NPM: ${BOARD_DOMAIN} → <IP LAN của VM>:5102 (WebSocket)

  web:
    build:
      context: ../apps/web
      args:
        API_INTERNAL_URL: http://api:3001
        NEXT_PUBLIC_WHITEBOARD_URL: wss://${BOARD_DOMAIN}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      # Link tuyệt đối cho ảnh chia sẻ mạng xã hội (trang quản trị nội dung).
      APP_URL: https://${APP_DOMAIN}
    logging: *logging
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5100}:3000"   # NPM: ${APP_DOMAIN} → <IP LAN của VM>:5100

  # Tự cập nhật bản ghi A trên Cloudflare khi IP nhà đổi. Chỉ chạy khi bật profile "ddns":
  #   docker compose -f deploy/docker-compose.homelab.yml --env-file .env --profile ddns up -d
  # Cách khuyên dùng: hoc., live., board. là CNAME trỏ về tên miền gốc; ddns chỉ cập nhật bản ghi A
  # của tên miền gốc (DDNS_DOMAINS), các CNAME tự theo. Đừng đưa tên đang là CNAME vào DDNS_DOMAINS.
  ddns:
    image: favonia/cloudflare-ddns:1.17.1
    profiles: ["ddns"]
    restart: unless-stopped
    mem_limit: 32m
    logging: *logging
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      DOMAINS: ${DDNS_DOMAINS:-}   # bắt buộc khi bật profile ddns, ví dụ chapter97.xyz
      # Tên miền gốc đang DNS only; giữ nguyên. live. (CNAME) phải DNS only vì TURN/UDP không qua proxy Cloudflare.
      PROXIED: "false"
      IP6_PROVIDER: none

volumes:
  pgdata:
