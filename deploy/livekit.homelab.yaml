# LiveKit trên máy chủ tại nhà (deploy/docker-compose.homelab.yml).
# Khoá API lấy từ LIVEKIT_KEYS trong file compose.
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  # Một cổng UDP cho mọi kết nối (mux): router chỉ cần mở một cổng.
  udp_port: 7882
  # Tự tìm IP công khai của nhà qua STUN, báo cho trình duyệt học viên.
  # Router phải chuyển 7881/tcp, 7882/udp, 3478/udp về VM (cùng số cổng).
  use_external_ip: true
turn:
  enabled: true
  # Bản ghi DNS live.<DOMAIN> phải là "DNS only" (mây xám) trên Cloudflare.
  domain: live.chapter97.xyz
  udp_port: 3478
redis:
  address: redis:6379
room:
  empty_timeout: 900
  # Máy 2 nhân, 4 GB RAM: giữ lớp dưới 30 người.
  max_participants: 30
webhook:
  api_key: bangden   # phải trùng LIVEKIT_API_KEY trong .env
  urls:
    - http://api:3001/webhooks/livekit
