name: bangden

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bangden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bangden
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bangden"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.8.0
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  api:
    build: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://bangden:${POSTGRES_PASSWORD}@postgres:5432/bangden
      JWT_SECRET: ${JWT_SECRET}
      WHITEBOARD_SECRET: ${WHITEBOARD_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD}
      SEED_TEACHER_NAME: ${SEED_TEACHER_NAME}
      SEED_DEMO: ${SEED_DEMO}
      COOKIE_SECURE: ${COOKIE_SECURE}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3001:3001"

  whiteboard:
    build: ./apps/whiteboard
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://bangden:${POSTGRES_PASSWORD}@postgres:5432/bangden
      WHITEBOARD_SECRET: ${WHITEBOARD_SECRET}
    ports:
      - "1234:1234"

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:3001
        NEXT_PUBLIC_WHITEBOARD_URL: ${WHITEBOARD_PUBLIC_URL}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
