# LiveKit trên VPS. Khoá API lấy từ LIVEKIT_KEYS (docker-compose.prod.yml).
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  # Một cổng UDP cho mọi kết nối (mux): dễ mở firewall, hợp với Docker bridge.
  udp_port: 7882
  # Tự tìm IP công khai của VPS qua STUN.
  use_external_ip: true
turn:
  enabled: true
  # Cùng tên miền với signaling; TURN/UDP cho mạng chặn UDP thường.
  domain: live.example.vn   # ĐỔI thành live.<DOMAIN>
  udp_port: 3478
room:
  empty_timeout: 900
  max_participants: 60
webhook:
  api_key: bangden   # phải trùng LIVEKIT_API_KEY
  urls:
    - http://api:3001/webhooks/livekit
